[package]
name = "baker-link-env"
version = "0.1.5"
edition = "2021"
build = "build.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
dioxus = { version = "0.7.1" }
log = "0.4"
futures-channel = { version = "0.3", features = ["std"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11.3"
rfd = "0.14.1"
cargo-generate = "0.23"
anyhow = "1.0.86"
chrono = "0.4.38"
sysinfo = "0.30.13"
open = "5.3.0"
probe-rs-tools = { path = "external/probe-rs/probe-rs-tools" }
tokio = { version = "1", features = ["rt", "time", "sync"] }
tokio-util = "0.7"
time = "0.3"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]


[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "Baker link. Env"
identifier = "baker.link.env"
resources = ["Cargo.toml", "src", "icon/"]
icons = ["icon/icon.ico", "icon/icon.png"]
out-dir="./dist"
license-file = "LICENSE"
